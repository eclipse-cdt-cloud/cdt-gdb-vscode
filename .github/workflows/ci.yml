name: ci

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Set Version
        # Set a unique version for PR and main builds. Use npm for access to required features.
        # Do nothing for tag references, these are release builds and should use the version from package.json as is.
        if: github.ref_type != 'tag'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DESCRIBE=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          echo "DESCRIBE: ${DESCRIBE}"
          if [ -z "${DESCRIBE}" ]; then
            echo "No semver tag matching vX.Y.Z found."
            exit 1
          fi
          BASE_VERSION=$(printf '%s\n' "${DESCRIBE}" | grep -Eo '^v[0-9]+\.[0-9]+\.[0-9]+')
          # Increment patch version and discard the leading 'v' from the tag for the printf.
          NEXT_VERSION="$(printf '%s\n' "${BASE_VERSION}" | awk -F. '{ printf "%d.%d.%d", substr($1, 2), $2, $3 + 1 }')"
          BRANCH_QUALIFIER=$(printf '%s\n' "${DESCRIBE}" | grep -Eo '[0-9]+\-g[0-9a-f]+$' || true)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH_QUALIFIER="pr${PR_NUMBER}-${BRANCH_QUALIFIER}"
          else
            SANITIZED_REF_NAME="${GITHUB_REF_NAME//[^0-9A-Za-z-]/-}"
            BRANCH_QUALIFIER="${SANITIZED_REF_NAME}${BRANCH_QUALIFIER}"
          fi
          # First without qualifier but incremented patch version as fallback
          npm version -s --allow-same-version --no-git-tag-version --new-version "${NEXT_VERSION}"
          # Then attempt with branch specific qualifier if available
          PR_VERSION="${NEXT_VERSION}-${BRANCH_QUALIFIER}"
          npm version --no-git-tag-version --new-version "${PR_VERSION}" && echo "Prerelease version set succeeded" || echo "Prerelease version set FAILED with exit code $?"
      - name: Build
        run: |
          yarn install
          yarn build
          yarn vsce:package
      - name: Verify code formatting is valid
        run: |
          yarn format-check
          yarn lint
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: ./*.vsix
          retention-days: 1

  release:
    needs: build
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.vsix

  publish-open-vsx-registry:
    needs: build
    name: Open VSX
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Publish
        run: |
          npx ovsx publish -i artifacts/*/*.vsix -p ${{secrets.OPEN_VSX_TOKEN}}

  publish-vscode-marketplace:
    needs: build
    name: VS Code Marketplace
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Publish
        run: |
          npx vsce publish -i artifacts/*/*.vsix -p ${{secrets.VS_MARKETPLACE_TOKEN}}
